<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quran Memorization Lab - Design your personalized memorization plan with spaced repetition" />
    <title>🕋 Quran Memorization Lab</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables */
        :root {
            --primary-color: #06b6d4;
            --accent-color: #10b981;
            --danger-color: #dc2626;
            --warning-color: #f59e0b;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%,
                rgba(6, 182, 212, 0.1) 25%,
                rgba(15, 23, 42, 0.3) 50%,
                rgba(6, 182, 212, 0.1) 75%,
                rgba(16, 185, 129, 0.1) 100%),
                radial-gradient(at 20% 50%, rgba(34, 197, 94, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                linear-gradient(to bottom, #0f172a, #1a1a2e);
            background-attachment: fixed;
            color: var(--text-secondary);
            min-height: 100vh;
        }

        body.arabic {
            font-family: 'Amiri', serif;
        }

        /* Navbar */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
        }

        .navbar-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .language-toggle {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .language-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Main Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
        }

        .glass-panel h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="number"]:hover,
        input[type="range"]:hover,
        select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        input[type="number"]:focus,
        input[type="range"]:focus,
        select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }

        input[type="range"] {
            accent-color: var(--primary-color);
            height: 0.375rem;
        }

        /* Duration Value */
        .duration-value {
            color: var(--primary-color);
            font-weight: 700;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Stats Card */
        .stats-card {
            background: rgba(6, 182, 212, 0.1);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid var(--glass-border);
            space: 0.75rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        /* Generate Button */
        .btn-generate {
            width: 100%;
            padding: 0.75rem 1.5rem;
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.4);
        }

        .btn-generate:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Error Message */
        .error-message {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 0.5rem;
            color: #fca5a5;
            font-weight: 500;
        }

        /* Plan Display */
        .plan-display {
            min-height: 400px;
        }

        .plan-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            padding: 2rem;
            text-align: center;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .plan-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .plan-header h2 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 0.75rem;
        }

        .plan-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .daily-targets-list h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .targets-scroll {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .targets-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .targets-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .targets-scroll::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.4);
            border-radius: 10px;
        }

        .targets-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.6);
        }

        /* Daily Target Card */
        .daily-target {
            padding: 1rem;
            border-left: 4px solid;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .daily-target:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transform: translateX(4px);
        }

        .daily-target.priority-high {
            border-left-color: var(--danger-color);
        }

        .daily-target.priority-medium {
            border-left-color: var(--warning-color);
        }

        .daily-target.priority-low {
            border-left-color: var(--accent-color);
        }

        .target-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .target-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .time-estimate {
            background: rgba(6, 182, 212, 0.3);
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .target-content {
            font-size: 0.9rem;
        }

        .sabaq,
        .manzil {
            margin-bottom: 0.5rem;
        }

        .target-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 0.5rem;
        }

        .verses-text {
            color: var(--text-secondary);
        }

        .revision-cycles {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }

        .revision {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Sticky Control Panel */
        @media (min-width: 1025px) {
            .control-panel {
                position: sticky;
                top: 80px;
                height: fit-content;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="navbar-content">
            <h1 class="navbar-title">🕋 <span id="navTitle">Quran Memorization Lab</span></h1>
            <button class="language-toggle" onclick="toggleLanguage()" id="langToggle">EN / ع</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="grid-layout">
            <!-- Control Panel -->
            <div class="glass-panel control-panel">
                <h2>⚙️ <span id="controlTitle">Plan Configuration</span></h2>

                <!-- Surah Select -->
                <div class="form-group">
                    <label for="surahSelect" id="surahLabel">📖 Select Surah</label>
                    <select id="surahSelect" onchange="updateAyahLimits()">
                        <!-- Populated by JavaScript -->
                    </select>
                </div>

                <!-- Ayah Range -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="startAyah" id="startAyahLabel">📍 Start Ayah</label>
                        <input type="number" id="startAyah" min="1" value="1" onchange="updateStats()" />
                    </div>
                    <div class="form-group">
                        <label for="endAyah" id="endAyahLabel">📍 End Ayah</label>
                        <input type="number" id="endAyah" min="1" value="110" onchange="updateStats()" />
                    </div>
                </div>

                <!-- Duration Slider -->
                <div class="form-group">
                    <label for="daysSlider" id="durationLabel">
                        ⏱️ Duration: <span class="duration-value" id="daysValue">30</span> <span id="daysText">days</span>
                    </label>
                    <input type="range" id="daysSlider" min="1" max="365" value="30" onchange="updateStats()" />
                    <div class="slider-labels">
                        <span>1</span>
                        <span>365</span>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="stats-card">
                    <div class="stat-item">
                        <span class="stat-label" id="totalVersesLabel">Total Verses:</span>
                        <span class="stat-value" id="totalVersesValue">109</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" id="versesPerDayLabel">Verses/Day:</span>
                        <span class="stat-value" id="versesPerDayValue">3.63</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" id="estimatedTimeLabel">Est. Total Time:</span>
                        <span class="stat-value" id="estimatedTimeValue">82 <span id="minutesText">min</span></span>
                    </div>
                </div>

                <!-- Generate Button -->
                <button class="btn-generate" onclick="generatePlan()" id="generateBtn">✨ Generate Plan</button>

                <!-- Error Message -->
                <div id="errorMessage" style="display: none;"></div>
            </div>

            <!-- Plan Display -->
            <div class="glass-panel plan-display">
                <div id="planContent" class="plan-empty">
                    <div class="empty-icon">🕋</div>
                    <p id="emptyText">Configure your plan and click "Generate Plan" to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Translations
        const translations = {
            en: {
                navTitle: "Quran Memorization Lab",
                controlTitle: "Plan Configuration",
                surahLabel: "📖 Select Surah",
                startAyahLabel: "📍 Start Ayah",
                endAyahLabel: "📍 End Ayah",
                durationLabel: "⏱️ Duration:",
                daysText: "days",
                totalVersesLabel: "Total Verses:",
                versesPerDayLabel: "Verses/Day:",
                estimatedTimeLabel: "Est. Total Time:",
                minutesText: "min",
                generateBtn: "✨ Generate Plan",
                generating: "⏳ Generating...",
                emptyText: "Configure your plan and click \"Generate Plan\" to get started!",
                planHeaderTitle: "Memorization Plan",
                dailyScheduleTitle: "📋 Daily Schedule",
                dayLabel: "Day",
                sabaqLabel: "📖 Sabaq (New):",
                manzilLabel: "🔄 Manzil (Revisions):",
                versesLabel: "Verses",
                errorEndLessThanStart: "End Ayah cannot be less than Start Ayah",
                errorInvalidDays: "Days must be between 1 and 365",
                errorFailedToGenerate: "Failed to generate plan",
            },
            ar: {
                navTitle: "معمل تحفيظ القرآن الكريم",
                controlTitle: "إعدادات الخطة",
                surahLabel: "📖 اختر السورة",
                startAyahLabel: "📍 الآية الأولى",
                endAyahLabel: "📍 الآية الأخيرة",
                durationLabel: "⏱️ المدة:",
                daysText: "أيام",
                totalVersesLabel: "إجمالي الآيات:",
                versesPerDayLabel: "الآيات/اليوم:",
                estimatedTimeLabel: "الوقت المتوقع:",
                minutesText: "دقيقة",
                generateBtn: "✨ إنشاء الخطة",
                generating: "⏳ جاري الإنشاء...",
                emptyText: "قم بتكوين خطتك وانقر على \"إنشاء الخطة\" للبدء!",
                planHeaderTitle: "خطة التحفيظ",
                dailyScheduleTitle: "📋 الجدول اليومي",
                dayLabel: "اليوم",
                sabaqLabel: "📖 الصبح (الجديد):",
                manzilLabel: "🔄 المنزل (المراجعات):",
                versesLabel: "الآيات",
                errorEndLessThanStart: "لا يمكن أن تكون الآية الأخيرة أقل من الآية الأولى",
                errorInvalidDays: "يجب أن تكون الأيام بين 1 و 365",
                errorFailedToGenerate: "فشل إنشاء الخطة",
            }
        };

        let currentLanguage = 'en';
        let surahs = [];

        // Initialize
        async function init() {
            try {
                const response = await fetch('/api/surahs');
                const data = await response.json();
                surahs = data.surahs;
                populateSurahs();
                updateStats();
            } catch (error) {
                console.error('Error fetching Surahs:', error);
            }
        }

        function populateSurahs() {
            const select = document.getElementById('surahSelect');
            select.innerHTML = surahs.map(s => 
                `<option value="${s.number}">${s.number}. ${s.englishName} (${s.arabicName}) - ${s.totalVerses} verses</option>`
            ).join('');
        }

        function updateAyahLimits() {
            const surahNum = parseInt(document.getElementById('surahSelect').value);
            const surah = surahs.find(s => s.number === surahNum);
            if (surah) {
                document.getElementById('startAyah').max = surah.totalVerses;
                document.getElementById('endAyah').max = surah.totalVerses;
                document.getElementById('startAyah').value = 1;
                document.getElementById('endAyah').value = surah.totalVerses;
                updateStats();
            }
        }

        function updateStats() {
            const daysSlider = document.getElementById('daysSlider');
            const daysValue = document.getElementById('daysValue');
            daysValue.textContent = daysSlider.value;

            const startAyah = parseInt(document.getElementById('startAyah').value) || 1;
            const endAyah = parseInt(document.getElementById('endAyah').value) || 1;
            const days = parseInt(daysSlider.value) || 1;

            const totalVerses = Math.max(0, endAyah - startAyah + 1);
            const versesPerDay = (totalVerses / days).toFixed(1);
            const totalTime = Math.round((totalVerses * 1.5 * days) / 60);

            document.getElementById('totalVersesValue').textContent = totalVerses;
            document.getElementById('versesPerDayValue').textContent = versesPerDay;
            document.getElementById('estimatedTimeValue').innerHTML = totalTime + ' <span id="minutesText">' + (translations[currentLanguage].minutesText) + '</span>';
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'ar' : 'en';
            document.documentElement.lang = currentLanguage;
            document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.toggle('arabic');

            // Update font
            if (currentLanguage === 'ar') {
                document.body.style.fontFamily = "'Amiri', serif";
            } else {
                document.body.style.fontFamily = "'Inter', sans-serif";
            }

            // Update UI text
            updateUIText();
        }

        function updateUIText() {
            const t = translations[currentLanguage];
            document.getElementById('navTitle').textContent = t.navTitle;
            document.getElementById('langToggle').textContent = currentLanguage === 'en' ? 'AR / ع' : 'EN / ا';
            document.getElementById('controlTitle').textContent = t.controlTitle;
            document.getElementById('surahLabel').textContent = t.surahLabel;
            document.getElementById('startAyahLabel').textContent = t.startAyahLabel;
            document.getElementById('endAyahLabel').textContent = t.endAyahLabel;
            document.getElementById('durationLabel').innerHTML = `${t.durationLabel} <span class="duration-value" id="daysValue">${document.getElementById('daysSlider').value}</span> <span id="daysText">${t.daysText}</span>`;
            document.getElementById('daysText').textContent = t.daysText;
            document.getElementById('totalVersesLabel').textContent = t.totalVersesLabel;
            document.getElementById('versesPerDayLabel').textContent = t.versesPerDayLabel;
            document.getElementById('estimatedTimeLabel').textContent = t.estimatedTimeLabel;
            document.getElementById('minutesText').textContent = t.minutesText;
            document.getElementById('generateBtn').textContent = t.generateBtn;
            document.getElementById('emptyText').textContent = t.emptyText;
        }

        async function generatePlan() {
            const btn = document.getElementById('generateBtn');
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            try {
                const surahNum = parseInt(document.getElementById('surahSelect').value);
                const startAyah = parseInt(document.getElementById('startAyah').value);
                const endAyah = parseInt(document.getElementById('endAyah').value);
                const days = parseInt(document.getElementById('daysSlider').value);

                if (endAyah < startAyah) {
                    throw new Error(translations[currentLanguage].errorEndLessThanStart);
                }
                if (days < 1 || days > 365) {
                    throw new Error(translations[currentLanguage].errorInvalidDays);
                }

                btn.disabled = true;
                btn.textContent = translations[currentLanguage].generating;

                const response = await fetch('/api/generate-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: `user_${Date.now()}`,
                        surahNumber: surahNum,
                        startVerse: startAyah,
                        endVerse: endAyah,
                        durationDays: days,
                        planName: `Lab Plan - ${surahNum}:${startAyah}-${endAyah} in ${days} days`,
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || translations[currentLanguage].errorFailedToGenerate);
                }

                displayPlan(data.plan);
            } catch (error) {
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = translations[currentLanguage].generateBtn;
            }
        }

        function displayPlan(plan) {
            const t = translations[currentLanguage];
            const content = document.getElementById('planContent');

            let html = `
                <div class="plan-header">
                    <h2>${plan.planName}</h2>
                    <div class="plan-meta">
                        <span>📅 ${plan.totalDays} ${t.daysText}</span>
                        <span>📖 ${plan.totalVerses} ${t.versesLabel}</span>
                    </div>
                </div>
                <div class="daily-targets-list">
                    <h3>${t.dailyScheduleTitle}</h3>
                    <div class="targets-scroll">
            `;

            plan.dailyTargets.forEach(target => {
                const priorityClass = `priority-${target.priority}`;
                const date = new Date(target.date).toLocaleDateString(currentLanguage === 'ar' ? 'ar-EG' : 'en-US');
                
                let manzilHtml = '';
                if (target.manzil.length > 0) {
                    manzilHtml = `
                        <div class="manzil">
                            <span class="target-label">${t.manzilLabel}</span>
                            <div class="revision-cycles">
                                ${target.manzil.map(rev => 
                                    `<span class="revision">${t.versesLabel} ${rev.startVerse}-${rev.endVerse}</span>`
                                ).join('')}
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="daily-target ${priorityClass}">
                        <div class="target-header">
                            <span class="day-number">${t.dayLabel} ${target.day}</span>
                            <span class="target-date">${date}</span>
                            <span class="time-estimate">${target.estimatedMinutes} ${t.minutesText}</span>
                        </div>
                        <div class="target-content">
                            <div class="sabaq">
                                <span class="target-label">${t.sabaqLabel}</span>
                                <span class="verses-text">${t.versesLabel} ${target.sabaq.startVerse}-${target.sabaq.endVerse}</span>
                            </div>
                            ${manzilHtml}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            content.innerHTML = html;
        }

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
